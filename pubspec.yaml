name: little_steps_tracker
description: Offline-first Anganwadi tracker (Poshan Tracker alternative)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State Management 
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Local Database (Offline-First)
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.4

  # Sync
  connectivity_plus: ^6.0.5

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1

  # UI / Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

  # Networking
  dio: ^5.7.0

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  #FireBase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/who/